<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="786" viewBox="0 0 300 786" fill="none" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs>
    <radialGradient id="gl"><stop offset="0" stop-color="#a3a3b8" stop-opacity=".30"/><stop offset="1" stop-color="#a3a3b8" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="4" y="4" width="292" height="254" rx="22"/></clipPath>
    </defs><g transform="translate(0,0)"><rect x="4" y="4" width="292" height="254" rx="22" fill="#12121c" stroke="#2a2a3d"/><rect x="28" y="28" width="48" height="48" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><circle cx="52" cy="52" r="14" stroke="#a3a3b8" stroke-width="2.2"/><circle cx="52" cy="52" r="8" stroke="#a3a3b8" stroke-width="2.2"/><circle cx="52" cy="52" r="2.6" fill="#a3a3b8"/><text x="270" y="56" font-size="14" fill="#a3a3b8" font-weight="600" text-anchor="end" font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace" letter-spacing="1">01</text><text x="28" y="120" font-size="21" fill="#f5f5fa" font-weight="700" text-anchor="start" letter-spacing="-.3">Product first</text><text x="28" y="150" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >Understand the problem before</text><text x="28" y="172" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >drawing screens. A beautiful</text><text x="28" y="194" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >design that solves nothing is</text><text x="28" y="216" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >still noise.</text></g><g transform="translate(0,262)"><rect x="4" y="4" width="292" height="254" rx="22" fill="#12121c" stroke="#2a2a3d"/><rect x="28" y="28" width="48" height="48" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><rect x="38" y="38" width="11" height="11" rx="3" stroke="#a3a3b8" stroke-width="2.2"/><rect x="55" y="38" width="11" height="11" rx="3" fill="#a3a3b8"/><rect x="38" y="55" width="11" height="11" rx="3" fill="#a3a3b8"/><rect x="55" y="55" width="11" height="11" rx="3" stroke="#a3a3b8" stroke-width="2.2"/><text x="270" y="56" font-size="14" fill="#a3a3b8" font-weight="600" text-anchor="end" font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace" letter-spacing="1">02</text><text x="28" y="120" font-size="21" fill="#f5f5fa" font-weight="700" text-anchor="start" letter-spacing="-.3">Systems, not screens</text><text x="28" y="150" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >Reusable components and tokens.</text><text x="28" y="172" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >If something repeats three times,</text><text x="28" y="194" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >it belongs in the system.</text></g><g transform="translate(0,524)"><rect x="4" y="4" width="292" height="254" rx="22" fill="#12121c" stroke="#2a2a3d"/><rect x="28" y="28" width="48" height="48" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><path d="M38 53 L67 39 L57 67 L51 57 Z" stroke="#a3a3b8" stroke-width="2.2" stroke-linejoin="round"/><path d="M51 57 L67 39" stroke="#a3a3b8" stroke-width="2.2" stroke-linecap="round"/><text x="270" y="56" font-size="14" fill="#a3a3b8" font-weight="600" text-anchor="end" font-family="'SF Mono', 'Fira Code', Menlo, Consolas, monospace" letter-spacing="1">03</text><text x="28" y="120" font-size="21" fill="#f5f5fa" font-weight="700" text-anchor="start" letter-spacing="-.3">Design is shipping</text><text x="28" y="150" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >Prototype in Figma, then ship it.</text><text x="28" y="172" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >Design only counts once it</text><text x="28" y="194" font-size="14" fill="#9a9ab5" font-weight="400" text-anchor="start" >reaches the people using it.</text></g></svg>